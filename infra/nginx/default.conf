server {
    listen 80;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend;
    client_max_body_size 1m;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        proxy_pass http://$backend_upstream:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$backend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # New clients always carry face-01, even in the single-shard/demo stack.
    location ~ ^/face-api/face-01(?<face_path>/.*)$ {
        set $face_auth_upstream face-auth;
        proxy_pass http://$face_auth_upstream:8000$face_path$is_args$args;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 3m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /face-api/ {
        set $face_auth_upstream face-auth;
        rewrite ^/face-api/(.*)$ /$1 break;
        proxy_pass http://$face_auth_upstream:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        client_max_body_size 3m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
