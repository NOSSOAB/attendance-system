upstream attendance_backends {
    least_conn;
    server backend-01:3000 max_fails=2 fail_timeout=10s;
    server backend-02:3000 max_fails=2 fail_timeout=10s;
    server backend-03:3000 max_fails=2 fail_timeout=10s;
    server backend-04:3000 max_fails=2 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=10s;
    client_max_body_size 1m;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        proxy_pass http://attendance_backends/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A session ticket contains one of face-01..face-40. Restricting the
    # capture prevents a user-controlled hostname from becoming an SSRF target.
    location ~ ^/face-api/(?<face_shard>face-(?:0[1-9]|[1-3][0-9]|40))(?<face_path>/.*)$ {
        proxy_pass http://$face_shard:8000$face_path$is_args$args;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_request_buffering off;
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health compatibility endpoint. User sessions never use this unsharded
    # route in the 300-student build.
    location /face-api/ {
        set $face_health_upstream face-01;
        rewrite ^/face-api/(.*)$ /$1 break;
        proxy_pass http://$face_health_upstream:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://attendance_backends;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
