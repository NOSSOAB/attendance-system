paths:
  database_path: "database_faces"
  face_db_path: "face_db.json"
  models_path: "models"
  output_path: "outputs"
  log_path: "logs"

# Isolated local benchmark profile. This deliberately bypasses active liveness
# so the load generator can replay enrolled images without pretending that the
# replay is a production authentication flow.
backend:
  session_ttl_seconds: 300
  max_sessions: 400
  max_upload_bytes: 2500000
  max_frame_dimension: 960
  detector_workers: 3
  max_inflight_frames: 6
  queue_timeout_seconds: 0.08
  verification_workers: 3
  verification_queue_capacity: 128
  auto_orient: true
  dominant_face_ratio: 1.60
  final_pose_limit: 20
  debug_save_frames: false
  debug_frame_interval: 20
  allow_skip_liveness: true

security:
  require_client_api_key: false
  session_start_rate_per_minute: 10000
  session_start_burst: 400
  frame_rate_per_second: 1000
  frame_rate_burst: 1000

thresholds:
  real_face_threshold: 0.80
  mobile_real_face_threshold: 0.35
  recognition_threshold: 0.60
  min_face_size_ratio: 0.20
  brightness_threshold: 50

recognition:
  model_name: "buffalo_l"
  intra_op_threads: 1

multi_frame:
  min_samples: 1
  max_samples: 1
  samples_per_challenge: 1
  sample_interval_seconds: 0
  jpeg_quality: 82
  recognition_sample_count: 1
  min_recognition_pass_ratio: 1

liveness:
  enabled: true
  number_of_challenges: 3
  challenge_actions: [blink, turn_left, turn_right, smile, mouth_open]
  challenge_timeout_seconds: 8
  retry_per_challenge: 2
  confirmation_frames: 2
  min_action_delay_seconds: 0.25
  blink_threshold: 0.20
  smile_threshold: 1.30
  mouth_open_threshold: 0.60
  yaw_left_threshold: -20
  yaw_right_threshold: 20
  pitch_up_threshold: -15
  pitch_down_threshold: 15
  roll_left_threshold: -15
  roll_right_threshold: 15
