      }

      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

</head>
<body class="bg-[#F7F9FB] flex justify-center text-slate-800 antialiased min-h-screen">
<div class="w-full max-w-[390px] min-h-screen bg-[#F7F9FB] flex flex-col relative pb-24 shadow-xl mx-auto">

<div class="px-4 -mt-10 space-y-4 flex-1">

<div class="absolute -right-12 -bottom-12 w-48 h-48 rounded-full bg-white/5 pointer-events-none"></div>
<div class="absolute -left-10 -top-10 w-36 h-36 rounded-full bg-white/5 pointer-events-none"></div>
<div class="absolute right-4 top-4 opacity-15 pointer-events-none">

</div>
<!-- Card Header: Trường ĐH Xây dựng Hà Nội -->
<div class="flex items-center justify-between pb-3 border-b border-white/15 relative z-10">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center p-1.5 border border-white/20">

<p class="text-[9px] font-medium text-blue-200">HANOI UNIVERSITY OF CIVIL ENGINEERING</p>

</div>
<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-white/20 text-white border border-white/20">HUCE SA</span>

<div class="mt-4 flex flex-col gap-4 relative z-10">
<div class="flex items-center gap-4">
<!-- Student Avatar / Ảnh thẻ -->
<div class="relative w-24 h-24 rounded-xl overflow-hidden border-2 border-white/60 shadow-md flex-shrink-0 bg-slate-100">
<img alt="Ảnh chân dung sinh viên" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1VB1O7uhXFxSJ0qG3TgUwXWkSMvyW0IiZtbPrx9_nGPI0emeGpdwb5XRY3nlMBCoAYLOUZUvsQUbUWDKvlRXbaPK_RCubo87qQUwY-xy7KkN8-MO8ppAUtrad_EQWsB68X5pKtPCYT1pJEAhL7_SfD8WJaJnURyYwhR5pIME2_129nJWB-8cbgz0wjOEvj_c_2FoykXNzaajiaO8ENPr8ba--euOdNIkp1QOb4wYAsKiK74qDGOqs6qSuI"/>
</div>
<!-- Name & MSSV Header -->

<h2 class="text-lg font-bold text-white tracking-tight truncate">NGUYỄN VĂN A</h2>
<div class="mt-1.5 flex items-center gap-1.5 bg-white/15 px-2.5 py-1 rounded-lg w-fit border border-white/15">
<span class="text-[11px] text-blue-200 font-medium">MSSV:</span>
<span class="text-sm font-bold text-white tracking-wide">123456</span>
</div>
</div>
</div>
<!-- Information Fields Specified by User -->
<div class="pt-3 border-t border-white/15 space-y-2 text-xs">
<div class="flex items-start justify-between gap-2">
<span class="text-blue-200 font-medium flex-shrink-0">Khoa:</span>
<span class="font-semibold text-white text-right">Xây dựng Dân dụng &amp; CN</span>
</div>
<div class="flex items-start justify-between gap-2">
<span class="text-blue-200 font-medium flex-shrink-0">Ngành:</span>
<span class="font-semibold text-white text-right">Kỹ thuật Xây dựng</span>
</div>
<div class="flex items-center justify-between gap-2">
<span class="text-blue-200 font-medium flex-shrink-0">Lớp quản lý:</span>
<span class="font-semibold text-white text-right">65KD1</span>
</div>
<div class="flex items-center justify-between gap-2">
<span class="text-blue-200 font-medium flex-shrink-0">Ngày sinh:</span>
<span class="font-semibold text-white text-right">15/10/2003</span>
</div>
</div>
</div>
</div>
</div>

<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>

<span class="text-[11px] font-medium leading-none">Điểm danh</span>
</div>
<!-- Tab 4: Hồ sơ (Active) -->
<div class="flex flex-col items-center gap-1 text-[#165DFF] cursor-pointer">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>

<span class="text-[11px] font-bold leading-none">Hồ sơ</span>

</div>
